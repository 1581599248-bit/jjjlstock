name: Verify tighter institution table and Excel

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-tight-institution-table.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-tight-institution-table-and-excel
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build website and test stock Excel
        run: |
          npm run build
          node --test tests/export-xlsx.test.mjs tests/stock-institution-export.test.mjs

      - name: Verify compact page and website-aligned Excel
        run: |
          grep -q 'width:540px' app/stock-institution-ranking.tsx
          grep -q 'col-company.*106px' app/stock-institution-ranking.tsx
          grep -q 'col-fund-count.*68px' app/stock-institution-ranking.tsx
          grep -q 'margin:11px 7px' app/stock-institution-ranking.tsx
          grep -q '\["机构排名", "基金公司", "持仓基金数", "持股数量(万股)", "持仓市值(万元)", "净增减持股数(万股)", "持仓变化"\]' app/lib/export-stock-reverse-xlsx.ts
          if grep -q '新进基金数\|增持基金数\|减持基金数\|不变基金数\|其他基金数' app/lib/export-stock-reverse-xlsx.ts; then
            echo "Obsolete institution change-count columns remain in Excel export"
            exit 1
          fi

      - name: Wait for Render deployment
        env:
          BASE_URL: https://fund-holdings-radar.onrender.com
          EXPECTED_MARKER: stock-institution-tight-excel-sync-20260806-2202
        run: |
          ready=false
          for attempt in $(seq 1 72); do
            value=$(curl -fsS --max-time 30 "$BASE_URL/stock-institution-version.txt?attempt=$attempt" 2>/dev/null || true)
            if [ "$value" = "$EXPECTED_MARKER" ]; then
              echo "Render marker is live on attempt $attempt"
              ready=true
              break
            fi
            echo "Waiting for Render deployment ($attempt/72)"
            sleep 10
          done
          if [ "$ready" != "true" ]; then
            echo "Render did not publish the tighter institution module in time"
            exit 1
          fi

      - name: Confirm live institution data remains correct
        run: |
          node --input-type=module <<'NODE'
          const base = "https://fund-holdings-radar.onrender.com";
          const period = "2026-06-30";
          const stockCode = "301345";
          const nonce = Date.now();
          const indexResponse = await fetch(`${base}/data/stocks/${period}/index.json?verify=${nonce}`, { cache: "no-store" });
          if (!indexResponse.ok) throw new Error(`Live index HTTP ${indexResponse.status}`);
          const index = await indexResponse.json();
          const item = index.stocks.find((row) => row.stockCode === stockCode);
          if (!item) throw new Error("Tao Motor missing from live index");
          const bucketResponse = await fetch(`${base}/data/stocks/${period}/buckets/${item.bucket}.json?verify=${nonce}`, { cache: "no-store" });
          if (!bucketResponse.ok) throw new Error(`Live bucket HTTP ${bucketResponse.status}`);
          const bucket = await bucketResponse.json();
          const detail = bucket.stocks[stockCode];
          const huitianfu = detail?.institutions?.find((row) => row.companyName.includes("汇添富"));
          if (!huitianfu || huitianfu.rank !== 3 || huitianfu.fundCount !== 3) throw new Error("Live Tao Motor institution data changed unexpectedly");
          console.log(JSON.stringify({ institutionCount: detail.institutionCount, huitianfu }, null, 2));
          NODE

      - name: Remove one-off verification workflow
        run: |
          git config user.name "fund-holdings-bot"
          git config user.email "fund-holdings-bot@users.noreply.github.com"
          git rm .github/workflows/verify-tight-institution-table.yml
          git commit -m "Complete tighter institution table verification [skip ci]"
          git push
