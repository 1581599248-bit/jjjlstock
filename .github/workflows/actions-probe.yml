name: Actions probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/actions-probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          date -u +%FT%TZ > public/actions-probe.txt
          git config user.name "fund-holdings-bot"
          git config user.email "fund-holdings-bot@users.noreply.github.com"
          git add public/actions-probe.txt
          git commit -m "Record GitHub Actions probe"
          git push
      - run: |
          git pull --rebase
          git rm .github/workflows/actions-probe.yml
          git commit -m "Complete GitHub Actions probe [skip ci]"
          git push
