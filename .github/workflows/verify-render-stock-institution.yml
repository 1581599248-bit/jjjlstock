name: Verify Render stock institution deployment

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-render-stock-institution.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-render-stock-institution-deployment
  cancel-in-progress: true

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for Render to serve the repaired deployment
        env:
          BASE_URL: https://fund-holdings-radar.onrender.com
          EXPECTED_MARKER: stock-institution-cache-fix-20260806-2142
        run: |
          ready=false
          for attempt in $(seq 1 72); do
            value=$(curl -fsS --max-time 30 "$BASE_URL/stock-institution-version.txt?attempt=$attempt" 2>/dev/null || true)
            if [ "$value" = "$EXPECTED_MARKER" ]; then
              echo "Render marker is live on attempt $attempt"
              ready=true
              break
            fi
            echo "Waiting for Render deployment ($attempt/72)"
            sleep 10
          done
          if [ "$ready" != "true" ]; then
            echo "Render did not publish the repaired deployment in time"
            exit 1
          fi

      - name: Verify live Tao Motor institution ranking
        run: |
          node --input-type=module <<'NODE'
          const base = "https://fund-holdings-radar.onrender.com";
          const period = "2026-06-30";
          const stockCode = "301345";
          const nonce = Date.now();
          const indexResponse = await fetch(`${base}/data/stocks/${period}/index.json?verify=${nonce}`, { cache: "no-store" });
          if (!indexResponse.ok) throw new Error(`Live index HTTP ${indexResponse.status}`);
          const index = await indexResponse.json();
          if (index.version !== 2) throw new Error(`Live index is still version ${index.version}`);
          const item = index.stocks.find((row) => row.stockCode === stockCode);
          if (!item) throw new Error("Tao Motor is missing from live index");
          const bucketResponse = await fetch(`${base}/data/stocks/${period}/buckets/${item.bucket}.json?verify=${nonce}`, { cache: "no-store" });
          if (!bucketResponse.ok) throw new Error(`Live bucket HTTP ${bucketResponse.status}`);
          const bucket = await bucketResponse.json();
          if (bucket.version !== 2) throw new Error(`Live bucket is still version ${bucket.version}`);
          const detail = bucket.stocks[stockCode];
          if (!detail || !Array.isArray(detail.institutions) || detail.institutions.length !== 10) throw new Error("Live Tao Motor institution top 10 is missing");
          const huitianfu = detail.institutions.find((row) => row.companyName.includes("汇添富"));
          if (!huitianfu || huitianfu.rank !== 3) throw new Error("Live Huitianfu ranking is incorrect");
          if (huitianfu.fundCount !== 3 || huitianfu.shares !== 53.42 || huitianfu.marketValue !== 12340.02) throw new Error("Live Huitianfu metrics are incorrect");
          console.log(JSON.stringify({ version: bucket.version, institutionCount: detail.institutionCount, huitianfu }, null, 2));
          NODE

      - name: Remove one-off live verification workflow
        run: |
          git config user.name "fund-holdings-bot"
          git config user.email "fund-holdings-bot@users.noreply.github.com"
          git rm .github/workflows/verify-render-stock-institution.yml
          git commit -m "Confirm live stock institution deployment [skip ci]"
          git push
