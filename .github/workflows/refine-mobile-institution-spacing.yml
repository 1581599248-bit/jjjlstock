name: Refine mobile institution column spacing

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refine-mobile-institution-spacing.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refine-mobile-institution-spacing
  cancel-in-progress: true

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refine mobile spacing without widening outer margins
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/stock-institution-ranking.tsx')
          text = path.read_text()
          replacements = {
              '.stock-institution-ranking-slot { margin:11px 14px; }': '.stock-institution-ranking-slot { margin:11px 7px; }',
              '.institution-ranking-table table { width:440px; min-width:440px; font-size:8.5px; }': '.institution-ranking-table table { width:436px; min-width:436px; font-size:8.5px; }',
              '.institution-ranking-table col.col-company { width:74px; }': '.institution-ranking-table col.col-company { width:72px; }',
              '.institution-ranking-table col.col-fund-count { width:48px; }': '.institution-ranking-table col.col-fund-count { width:46px; }',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match for {old!r}, found {count}')
              text = text.replace(old, new)
          path.write_text(text)
          Path('public/stock-institution-version.txt').write_text('stock-institution-mobile-refined-20260806-2303\n')
          PY

      - run: npm ci

      - name: Build website
        run: npm run build

      - name: Verify refined spacing
        run: |
          grep -q 'margin:11px 7px' app/stock-institution-ranking.tsx
          grep -q 'width:436px' app/stock-institution-ranking.tsx
          grep -q 'col-company.*72px' app/stock-institution-ranking.tsx
          grep -q 'col-fund-count.*46px' app/stock-institution-ranking.tsx
          grep -q 'padding:6px 2px' app/stock-institution-ranking.tsx

      - name: Commit refined mobile layout
        run: |
          git config user.name "fund-holdings-bot"
          git config user.email "fund-holdings-bot@users.noreply.github.com"
          git add app/stock-institution-ranking.tsx public/stock-institution-version.txt
          git commit -m "Refine mobile institution column spacing"
          git push

      - name: Wait for Render deployment
        env:
          BASE_URL: https://fund-holdings-radar.onrender.com
          EXPECTED_MARKER: stock-institution-mobile-refined-20260806-2303
        run: |
          ready=false
          for attempt in $(seq 1 72); do
            value=$(curl -fsS --max-time 30 "$BASE_URL/stock-institution-version.txt?attempt=$attempt" 2>/dev/null || true)
            if [ "$value" = "$EXPECTED_MARKER" ]; then
              echo "Render marker is live on attempt $attempt"
              ready=true
              break
            fi
            echo "Waiting for Render deployment ($attempt/72)"
            sleep 10
          done
          if [ "$ready" != "true" ]; then
            echo "Render did not publish the refined mobile table in time"
            exit 1
          fi

      - name: Remove one-off workflow
        run: |
          git pull --rebase
          git rm .github/workflows/refine-mobile-institution-spacing.yml
          git commit -m "Complete refined mobile institution spacing verification [skip ci]"
          git push
