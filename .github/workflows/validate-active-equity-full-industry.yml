name: Validate active equity full-industry module

on:
  pull_request:
    branches: [main]
    paths:
      - "active-equity-full-industry.run"
      - "app/market-industry-allocation.tsx"
      - "app/api/market-industries/route.ts"
      - "scripts/build-static-market-industries.mjs"
      - "scripts/apply-fund-product-search-patch.mjs"
      - "tests/market-industry-allocation.test.mjs"
      - ".github/workflows/validate-active-equity-full-industry.yml"

permissions:
  contents: write

concurrency:
  group: active-equity-full-industry-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-and-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Mount source UI
        run: node scripts/apply-fund-product-search-patch.mjs

      - name: Build Q1 and Q2 active-equity SW level-one snapshots
        run: |
          node scripts/build-static-market-industries.mjs --period=2026-03-31 --minimum-classification-coverage=0.90
          node scripts/build-static-market-industries.mjs --period=2026-06-30 --minimum-classification-coverage=0.90

      - name: Validate Q2 scope, totals, and quarter-over-quarter changes
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const q2 = JSON.parse(await readFile('public/data/market-industries/2026-06-30.json', 'utf8'));
          if (q2.version !== 2 || q2.period !== '2026-06-30' || q2.quarter !== 'Q2') throw new Error('Q2 identity mismatch');
          if (q2.scope?.fundUniverse !== '主动偏股公募基金') throw new Error('fund universe mismatch');
          if (q2.scope?.classification !== '申万一级行业（2021）') throw new Error('classification mismatch');
          const expectedTypes = ['普通股票型', '偏股混合型', '灵活配置型', '平衡混合型'];
          if (JSON.stringify(q2.scope?.fundTypes) !== JSON.stringify(expectedTypes)) throw new Error('fund type scope mismatch');
          if (!Array.isArray(q2.industries) || q2.industries.length < 30) throw new Error('industry rows incomplete');
          const shareSum = q2.industries.reduce((sum, row) => sum + Number(row.allocationShare || 0), 0);
          if (Math.abs(shareSum - 100) > 0.05) throw new Error(`allocation shares sum to ${shareSum}`);
          if (q2.classificationCoverage < 0.90) throw new Error('classification coverage below threshold');
          if (q2.industries.filter((row) => row.qoqChange !== null).length < 25) throw new Error('quarter-over-quarter comparison incomplete');
          for (const row of q2.industries) {
            if (!Number.isInteger(row.rank) || !row.industry || !(row.marketValue >= 0) || !(row.allocationShare >= 0)) throw new Error(`invalid industry row ${JSON.stringify(row)}`);
          }
          console.log(JSON.stringify({ activeFundCount: q2.activeFundCount, industries: q2.industries.length, classificationCoverage: q2.classificationCoverage, shareSum }));
          NODE

      - name: Run complete test suite
        run: npm test

      - name: Commit generated source and data to the PR branch
        run: |
          printf '%s\n' 'active-equity-full-industry-20260807-0128' > public/active-equity-full-industry-version.txt
          git config user.name "fund-holdings-bot"
          git config user.email "fund-holdings-bot@users.noreply.github.com"
          git add app/page.tsx app/globals.css public/data/market-industries public/active-equity-full-industry-version.txt
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Generate active equity SW level-one industry data [skip ci]"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
