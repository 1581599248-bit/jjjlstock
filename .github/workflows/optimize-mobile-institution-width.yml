name: Optimize mobile institution module width

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/optimize-mobile-institution-width.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimize-mobile-institution-width
  cancel-in-progress: true

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Expand mobile module and rebalance spacing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/stock-institution-ranking.tsx')
          text = path.read_text()
          replacements = {
              '.stock-institution-ranking-slot { margin:11px 7px; }': '.stock-institution-ranking-slot { margin:11px 3px; }',
              '.institution-ranking-card { padding:10px; border-radius:13px; }': '.institution-ranking-card { padding:9px; border-radius:13px; }',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match for {old!r}, found {count}')
              text = text.replace(old, new)
          marker = 'stock-institution-mobile-balanced-20260806-2312\n'
          path.write_text(text)
          Path('public/stock-institution-version.txt').write_text(marker)
          PY

      - run: npm ci

      - name: Build website
        run: npm run build

      - name: Verify balanced mobile width
        run: |
          grep -q 'margin:11px 3px' app/stock-institution-ranking.tsx
          grep -q 'padding:9px' app/stock-institution-ranking.tsx
          grep -q 'width:436px' app/stock-institution-ranking.tsx
          grep -q 'col-company.*72px' app/stock-institution-ranking.tsx
          grep -q 'col-fund-count.*46px' app/stock-institution-ranking.tsx

      - name: Commit optimized mobile layout
        run: |
          git config user.name "fund-holdings-bot"
          git config user.email "fund-holdings-bot@users.noreply.github.com"
          git add app/stock-institution-ranking.tsx public/stock-institution-version.txt
          git commit -m "Expand mobile institution module and rebalance spacing"
          git push

      - name: Wait for Render deployment
        env:
          BASE_URL: https://fund-holdings-radar.onrender.com
          EXPECTED_MARKER: stock-institution-mobile-balanced-20260806-2312
        run: |
          ready=false
          for attempt in $(seq 1 72); do
            value=$(curl -fsS --max-time 30 "$BASE_URL/stock-institution-version.txt?attempt=$attempt" 2>/dev/null || true)
            if [ "$value" = "$EXPECTED_MARKER" ]; then
              echo "Render marker is live on attempt $attempt"
              ready=true
              break
            fi
            echo "Waiting for Render deployment ($attempt/72)"
            sleep 10
          done
          if [ "$ready" != "true" ]; then
            echo "Render did not publish the balanced mobile layout in time"
            exit 1
          fi

      - name: Remove one-off workflow
        run: |
          git pull --rebase
          git rm .github/workflows/optimize-mobile-institution-width.yml
          git commit -m "Complete mobile institution width optimization [skip ci]"
          git push
