name: Polish mobile institution table

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/polish-mobile-institution-table.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: polish-mobile-institution-table
  cancel-in-progress: true

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rebalance mobile table spacing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/stock-institution-ranking.tsx')
          text = path.read_text()
          replacements = {
              '.institution-ranking-table table { width:436px; min-width:436px; font-size:8.5px; }': '.institution-ranking-table table { width:442px; min-width:442px; font-size:8.5px; }',
              '.institution-ranking-table col.col-rank { width:32px; }': '.institution-ranking-table col.col-rank { width:34px; }',
              '.institution-ranking-table col.col-company { width:72px; }': '.institution-ranking-table col.col-company { width:70px; }',
              '.institution-ranking-table col.col-fund-count { width:46px; }': '.institution-ranking-table col.col-fund-count { width:54px; }',
              '.institution-ranking-table col.col-change-shares { width:80px; }': '.institution-ranking-table col.col-change-shares { width:78px; }',
              '.institution-ranking-table th,.institution-ranking-table td { padding:6px 2px; }': '.institution-ranking-table th,.institution-ranking-table td { padding:6px 2px; }\n        .institution-ranking-table th:first-child,.institution-ranking-table td:first-child { padding-left:4px; padding-right:1px; }',
              '.institution-ranking-table th.fund-count { white-space:normal; line-height:1.1; }': '.institution-ranking-table th.fund-count { white-space:nowrap; line-height:1.1; font-size:8px; }',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match for {old!r}, found {count}')
              text = text.replace(old, new)
          path.write_text(text)
          Path('public/stock-institution-version.txt').write_text('stock-institution-mobile-polished-20260806-2321\n')
          PY

      - run: npm ci

      - name: Build website
        run: npm run build

      - name: Verify polished mobile layout
        run: |
          grep -q 'width:442px' app/stock-institution-ranking.tsx
          grep -q 'col-rank.*34px' app/stock-institution-ranking.tsx
          grep -q 'col-company.*70px' app/stock-institution-ranking.tsx
          grep -q 'col-fund-count.*54px' app/stock-institution-ranking.tsx
          grep -q 'padding-left:4px' app/stock-institution-ranking.tsx
          grep -q 'th.fund-count.*white-space:nowrap' app/stock-institution-ranking.tsx

      - name: Commit polished mobile layout
        run: |
          git config user.name "fund-holdings-bot"
          git config user.email "fund-holdings-bot@users.noreply.github.com"
          git add app/stock-institution-ranking.tsx public/stock-institution-version.txt
          git commit -m "Polish mobile institution table alignment"
          git push

      - name: Wait for Render deployment
        env:
          BASE_URL: https://fund-holdings-radar.onrender.com
          EXPECTED_MARKER: stock-institution-mobile-polished-20260806-2321
        run: |
          ready=false
          for attempt in $(seq 1 72); do
            value=$(curl -fsS --max-time 30 "$BASE_URL/stock-institution-version.txt?attempt=$attempt" 2>/dev/null || true)
            if [ "$value" = "$EXPECTED_MARKER" ]; then
              echo "Render marker is live on attempt $attempt"
              ready=true
              break
            fi
            echo "Waiting for Render deployment ($attempt/72)"
            sleep 10
          done
          if [ "$ready" != "true" ]; then
            echo "Render did not publish the polished mobile table in time"
            exit 1
          fi

      - name: Remove one-off workflow
        run: |
          git pull --rebase
          git rm .github/workflows/polish-mobile-institution-table.yml
          git commit -m "Complete mobile institution polish verification [skip ci]"
          git push
