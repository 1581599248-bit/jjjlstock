name: Rebuild stock institution rankings

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rebuild-stock-institutions.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-stock-institution-rankings
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Rebuild stock reverse-lookup data
        run: |
          node scripts/build-static-stock-search.mjs --period=2026-03-31
          node scripts/build-static-stock-search.mjs --period=2026-06-30

      - name: Verify Tao Motor institution coverage
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFile } from "node:fs/promises";
          const period = "2026-06-30";
          const stockCode = "301345";
          const bucket = createHash("sha1").update(stockCode).digest("hex").slice(0, 2);
          const payload = JSON.parse(await readFile(`public/data/stocks/${period}/buckets/${bucket}.json`, "utf8"));
          const detail = payload.stocks[stockCode];
          if (!detail) throw new Error("Missing 301345 stock detail");
          if (!Array.isArray(detail.institutions) || detail.institutions.length === 0) throw new Error("Missing institution ranking");
          const huitianfu = detail.institutions.find((row) => row.companyName.includes("汇添富"));
          if (!huitianfu) throw new Error("汇添富基金 is missing from 301345 institution ranking");
          for (let index = 0; index < detail.institutions.length; index += 1) {
            const row = detail.institutions[index];
            if (row.rank !== index + 1) throw new Error(`Invalid institution rank ${row.companyName}`);
            if (index > 0 && detail.institutions[index - 1].marketValue < row.marketValue) throw new Error("Institution ranking is not sorted by market value");
            if (row.fundCount < 1 || row.shares < 0 || row.marketValue < 0) throw new Error(`Invalid institution metrics ${row.companyName}`);
          }
          console.log(JSON.stringify({ stockCode, institutionCount: detail.institutionCount, huitianfu, top10: detail.institutions }, null, 2));
          NODE

      - name: Validate stock module and Excel
        run: |
          npm run build
          node --test tests/static-stock-search.test.mjs tests/export-xlsx.test.mjs tests/stock-institution-export.test.mjs

      - name: Publish institution rankings
        run: |
          git config user.name "fund-holdings-bot"
          git config user.email "fund-holdings-bot@users.noreply.github.com"
          git rm .github/workflows/rebuild-stock-institutions.yml
          git add public/data/stocks/2026-03-31 public/data/stocks/2026-06-30
          git commit -m "Publish stock institution rankings [skip ci]"
          git push

# retry: cancel stale run and validate only the stock institution module
